<div class="voice-orb" [attr.data-mode]="state">
  <canvas #orbitCanvas aria-hidden="true" class="voice-orb-canvas" width="512" height="512"></canvas>
  <button
    class="voice-orb-button"
    type="button"
    [disabled]="disabled || state === 'finalising'"
    [attr.aria-label]="buttonLabel"
    [attr.aria-pressed]="active"
    (click)="orbToggle.emit()"
  >
    @if (!active) {
      <svg aria-hidden="true" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/>
      </svg>
    } @else {
      <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12" rx="2.6" fill="currentColor"/>
      </svg>
    }
  </button>
</div>
